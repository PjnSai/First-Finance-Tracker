<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  </head>
  <body class="bg-slate-100 text-slate-800 min-h-screen">
    <!-- Header: Running Balance -->
    <header
      class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md"
    >
      <div class="max-w-3xl mx-auto px-4 py-8 sm:py-10">
        <p class="text-sm uppercase tracking-wider text-indigo-100">
          Running Balance
        </p>
        <p
          id="balance"
          class="text-4xl sm:text-5xl font-bold mt-1 tabular-nums"
        >
          £0.00
        </p>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-6 grid gap-6">
      <!-- Transaction Entry Form -->
      <section class="bg-white rounded-xl shadow-sm p-5">
        <h2 class="text-lg font-semibold mb-4">Add Transaction</h2>
        <form id="txForm" class="grid gap-4 sm:grid-cols-2" novalidate>
          <div class="sm:col-span-2">
            <label
              for="description"
              class="block text-sm font-medium text-slate-600 mb-1"
              >Description</label
            >
            <input
              id="description"
              type="text"
              required
              placeholder="e.g. Weekly groceries"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              for="amount"
              class="block text-sm font-medium text-slate-600 mb-1"
              >Amount (£)</label
            >
            <input
              id="amount"
              type="number"
              required
              min="0.01"
              step="0.01"
              placeholder="0.00"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <div>
            <label
              for="type"
              class="block text-sm font-medium text-slate-600 mb-1"
              >Type</label
            >
            <select
              id="type"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option value="income">Income</option>
              <option value="expense" selected>Expense</option>
            </select>
          </div>

          <div class="sm:col-span-2">
            <label
              for="category"
              class="block text-sm font-medium text-slate-600 mb-1"
              >Category</label
            >
            <select
              id="category"
              class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
            >
              <option>Food</option>
              <option>Utilities</option>
              <option>Salary</option>
              <option>Entertainment</option>
              <option>Transport</option>
            </select>
          </div>

          <p
            id="formError"
            class="sm:col-span-2 text-sm text-rose-600 hidden"
          ></p>

          <div class="sm:col-span-2">
            <button
              type="submit"
              class="w-full sm:w-auto rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
            >
              Add Transaction
            </button>
          </div>
        </form>
      </section>

      <!-- Summary: Stat Cards + Expense Chart -->
      <section class="grid gap-4">
        <h2 class="text-lg font-semibold">Summary</h2>

        <div class="grid gap-4 sm:grid-cols-3">
          <div class="rounded-xl bg-white shadow-sm p-5">
            <p class="text-sm font-medium text-slate-500">Total Income</p>
            <p
              id="totalIncome"
              class="mt-1 text-2xl font-bold text-emerald-600 tabular-nums"
            >
              £0.00
            </p>
          </div>
          <div class="rounded-xl bg-white shadow-sm p-5">
            <p class="text-sm font-medium text-slate-500">Total Expenses</p>
            <p
              id="totalExpenses"
              class="mt-1 text-2xl font-bold text-rose-600 tabular-nums"
            >
              £0.00
            </p>
          </div>
          <div
            id="netCard"
            class="rounded-xl shadow-sm p-5 transition-colors bg-white"
          >
            <p id="netLabel" class="text-sm font-medium">Net Balance</p>
            <p id="netBalance" class="mt-1 text-2xl font-bold tabular-nums">
              £0.00
            </p>
          </div>
        </div>

        <div class="rounded-xl bg-white shadow-sm p-5">
          <h3 class="text-base font-semibold mb-4">Spending by Category</h3>
          <div class="relative mx-auto h-72 max-w-sm">
            <canvas
              id="expenseChart"
              aria-label="Pie chart of expenses by category"
              role="img"
            ></canvas>
            <p
              id="chartEmpty"
              class="absolute inset-0 hidden items-center justify-center text-sm text-slate-500"
            >
              No expenses yet.
            </p>
          </div>
        </div>
      </section>

      <!-- Transaction List -->
      <section class="bg-white rounded-xl shadow-sm p-5">
        <h2 class="text-lg font-semibold mb-4">Transactions</h2>
        <ul id="txList" class="divide-y divide-slate-100"></ul>
        <p id="emptyState" class="text-sm text-slate-500 hidden">
          No transactions yet.
        </p>
      </section>
    </main>

    <script>
      // State
      const transactions = [
        {
          id: 1,
          description: "Monthly salary",
          amount: 2400.0,
          type: "income",
          category: "Salary",
        },
        {
          id: 2,
          description: "Supermarket shop",
          amount: 64.35,
          type: "expense",
          category: "Food",
        },
        {
          id: 3,
          description: "Electricity bill",
          amount: 89.0,
          type: "expense",
          category: "Utilities",
        },
        {
          id: 4,
          description: "Cinema tickets",
          amount: 22.5,
          type: "expense",
          category: "Entertainment",
        },
        {
          id: 5,
          description: "Train season top-up",
          amount: 45.0,
          type: "expense",
          category: "Transport",
        },
      ];

      // One source of truth per category: badge classes + chart colour
      const CATEGORIES = {
        Food: { badge: "bg-amber-100 text-amber-800", color: "#f59e0b" },
        Utilities: { badge: "bg-sky-100 text-sky-800", color: "#0ea5e9" },
        Salary: { badge: "bg-emerald-100 text-emerald-800", color: "#10b981" },
        Entertainment: {
          badge: "bg-fuchsia-100 text-fuchsia-800",
          color: "#d946ef",
        },
        Transport: { badge: "bg-indigo-100 text-indigo-800", color: "#6366f1" },
      };

      // Helpers
      const currency = new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP",
      });

      function escapeHTML(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function getTotals() {
        let income = 0,
          expenses = 0;
        for (const t of transactions) {
          if (t.type === "income") income += t.amount;
          else expenses += t.amount;
        }
        return { income, expenses, net: income - expenses };
      }

      function getExpensesByCategory() {
        const totals = {};
        for (const t of transactions) {
          if (t.type !== "expense") continue;
          totals[t.category] = (totals[t.category] || 0) + t.amount;
        }
        return totals;
      }

      // Rendering
      const balanceEl = document.getElementById("balance");
      const listEl = document.getElementById("txList");
      const emptyEl = document.getElementById("emptyState");

      function renderBalance({ net }) {
        balanceEl.textContent = currency.format(net);
        balanceEl.classList.toggle("text-rose-200", net < 0);
      }

      const netCard = document.getElementById("netCard");
      const netLabel = document.getElementById("netLabel");
      const netValue = document.getElementById("netBalance");

      const NET_STYLES = {
        positive: {
          card: ["bg-emerald-50", "ring-1", "ring-emerald-200"],
          label: "text-emerald-700",
          value: "text-emerald-700",
        },
        negative: {
          card: ["bg-rose-50", "ring-1", "ring-rose-200"],
          label: "text-rose-700",
          value: "text-rose-700",
        },
        zero: {
          card: ["bg-white"],
          label: "text-slate-500",
          value: "text-slate-800",
        },
      };
      const ALL_NET_CLASSES = {
        card: [...new Set(Object.values(NET_STYLES).flatMap((s) => s.card))],
        label: Object.values(NET_STYLES).map((s) => s.label),
        value: Object.values(NET_STYLES).map((s) => s.value),
      };

      function renderSummary({ income, expenses, net }) {
        document.getElementById("totalIncome").textContent =
          currency.format(income);
        document.getElementById("totalExpenses").textContent =
          currency.format(expenses);
        netValue.textContent = currency.format(net);

        const state = net > 0 ? "positive" : net < 0 ? "negative" : "zero";
        const s = NET_STYLES[state];
        netCard.classList.remove(...ALL_NET_CLASSES.card);
        netCard.classList.add(...s.card);
        netLabel.classList.remove(...ALL_NET_CLASSES.label);
        netLabel.classList.add(s.label);
        netValue.classList.remove(...ALL_NET_CLASSES.value);
        netValue.classList.add(s.value);
      }

      // Chart
      const chartEmptyEl = document.getElementById("chartEmpty");
      const expenseChart = new Chart(document.getElementById("expenseChart"), {
        type: "pie",
        data: {
          labels: [],
          datasets: [
            {
              data: [],
              backgroundColor: [],
              borderColor: "#ffffff",
              borderWidth: 2,
            },
          ],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: "bottom",
              labels: { usePointStyle: true, padding: 16 },
            },
            tooltip: {
              callbacks: {
                label(ctx) {
                  const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                  const pct = total
                    ? ((ctx.parsed / total) * 100).toFixed(1)
                    : 0;
                  return ` ${ctx.label}: ${currency.format(ctx.parsed)} (${pct}%)`;
                },
              },
            },
          },
        },
      });

      function renderChart() {
        const byCategory = getExpensesByCategory();
        const labels = Object.keys(CATEGORIES).filter((c) => byCategory[c] > 0);
        const ds = expenseChart.data.datasets[0];

        expenseChart.data.labels = labels;
        ds.data = labels.map((c) => Math.round(byCategory[c] * 100) / 100);
        ds.backgroundColor = labels.map((c) => CATEGORIES[c].color);
        expenseChart.update();

        const empty = labels.length === 0;
        chartEmptyEl.classList.toggle("hidden", !empty);
        chartEmptyEl.classList.toggle("flex", empty);
      }

      function renderList() {
        emptyEl.classList.toggle("hidden", transactions.length > 0);

        // Newest first
        listEl.innerHTML = [...transactions]
          .reverse()
          .map((t) => {
            const isIncome = t.type === "income";
            const badge =
              CATEGORIES[t.category]?.badge || "bg-slate-100 text-slate-700";
            return `
          <li class="flex items-center gap-3 py-3">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full font-bold
                         ${isIncome ? "bg-emerald-100 text-emerald-700" : "bg-rose-100 text-rose-700"}"
                  title="${isIncome ? "Income" : "Expense"}">
              ${isIncome ? "+" : "−"}
            </span>
            <div class="min-w-0 flex-1">
              <p class="font-medium truncate">${escapeHTML(t.description)}</p>
              <span class="mt-1 inline-block rounded-full px-2 py-0.5 text-xs font-medium ${badge}">
                ${t.category}
              </span>
            </div>
            <p class="shrink-0 font-semibold tabular-nums ${isIncome ? "text-emerald-600" : "text-rose-600"}">
              ${isIncome ? "+" : "−"}${currency.format(t.amount)}
            </p>
          </li>`;
          })
          .join("");
      }

      // Single entry point: every UI piece refreshes from the same data
      function render() {
        const totals = getTotals();
        renderBalance(totals);
        renderSummary(totals);
        renderChart();
        renderList();
      }

      // Form handling
      const form = document.getElementById("txForm");
      const errorEl = document.getElementById("formError");

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const description = form.description.value.trim();
        const amount = parseFloat(form.amount.value);

        if (!description) return showError("Please enter a description.");
        if (!Number.isFinite(amount) || amount <= 0)
          return showError("Please enter an amount greater than 0.");

        transactions.push({
          id: Date.now(),
          description,
          amount: Math.round(amount * 100) / 100,
          type: form.type.value,
          category: form.category.value,
        });

        errorEl.classList.add("hidden");
        form.description.value = "";
        form.amount.value = "";
        form.description.focus();
        render();
      });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.classList.remove("hidden");
      }

      render();
    </script>
  </body>
</html>
