<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Finance Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    dialog::backdrop { background: rgb(15 23 42 / 0.5); }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- Header: Running Balance -->
  <header class="bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-8 sm:py-10">
      <p class="text-sm uppercase tracking-wider text-indigo-100">Running Balance</p>
      <p id="balance" class="text-4xl sm:text-5xl font-bold mt-1 tabular-nums">£0.00</p>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-6 grid gap-6">

    <!-- Transaction Entry / Edit Form -->
    <section id="formSection" class="bg-white rounded-xl shadow-sm p-5 transition-shadow">
      <div class="flex items-center justify-between mb-4">
        <h2 id="formTitle" class="text-lg font-semibold">Add Transaction</h2>
        <span id="editBadge" class="hidden rounded-full bg-amber-100 px-2.5 py-0.5 text-xs font-medium text-amber-800">Editing</span>
      </div>
      <form id="txForm" class="grid gap-4 sm:grid-cols-2" novalidate>
        <div class="sm:col-span-2">
          <label for="description" class="block text-sm font-medium text-slate-600 mb-1">Description</label>
          <input id="description" type="text" required placeholder="e.g. Weekly groceries"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label for="amount" class="block text-sm font-medium text-slate-600 mb-1">Amount (£)</label>
          <input id="amount" type="number" required min="0.01" step="0.01" placeholder="0.00"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label for="type" class="block text-sm font-medium text-slate-600 mb-1">Type</label>
          <select id="type"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="income">Income</option>
            <option value="expense" selected>Expense</option>
          </select>
        </div>

        <div class="sm:col-span-2">
          <label for="category" class="block text-sm font-medium text-slate-600 mb-1">Category</label>
          <select id="category"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option>Food</option>
            <option>Utilities</option>
            <option>Salary</option>
            <option>Entertainment</option>
            <option>Transport</option>
          </select>
        </div>

        <p id="formError" class="sm:col-span-2 text-sm text-rose-600 hidden"></p>

        <div class="sm:col-span-2 flex flex-col gap-2 sm:flex-row">
          <button id="submitBtn" type="submit"
            class="rounded-lg bg-indigo-600 px-5 py-2.5 font-medium text-white hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
            Add Transaction
          </button>
          <button id="cancelEditBtn" type="button"
            class="hidden rounded-lg border border-slate-300 px-5 py-2.5 font-medium text-slate-700 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-400 focus:ring-offset-2">
            Cancel
          </button>
        </div>
      </form>
    </section>

    <!-- Summary: Stat Cards + Expense Chart -->
    <section class="grid gap-4">
      <h2 class="text-lg font-semibold">Summary</h2>

      <div class="grid gap-4 sm:grid-cols-3">
        <div class="rounded-xl bg-white shadow-sm p-5">
          <p class="text-sm font-medium text-slate-500">Total Income</p>
          <p id="totalIncome" class="mt-1 text-2xl font-bold text-emerald-600 tabular-nums">£0.00</p>
        </div>
        <div class="rounded-xl bg-white shadow-sm p-5">
          <p class="text-sm font-medium text-slate-500">Total Expenses</p>
          <p id="totalExpenses" class="mt-1 text-2xl font-bold text-rose-600 tabular-nums">£0.00</p>
        </div>
        <div id="netCard" class="rounded-xl shadow-sm p-5 transition-colors bg-white">
          <p id="netLabel" class="text-sm font-medium">Net Balance</p>
          <p id="netBalance" class="mt-1 text-2xl font-bold tabular-nums">£0.00</p>
        </div>
      </div>

      <div class="rounded-xl bg-white shadow-sm p-5">
        <h3 class="text-base font-semibold mb-4">Spending by Category</h3>
        <div class="relative mx-auto h-72 max-w-sm">
          <canvas id="expenseChart" aria-label="Pie chart of expenses by category" role="img"></canvas>
          <p id="chartEmpty" class="absolute inset-0 hidden items-center justify-center text-sm text-slate-500">
            No expenses yet.
          </p>
        </div>
      </div>
    </section>

    <!-- Transaction List -->
    <section class="bg-white rounded-xl shadow-sm p-5">
      <h2 class="text-lg font-semibold mb-4">Transactions</h2>

      <!-- Search + Filters -->
      <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center">
        <div class="relative flex-1">
          <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M9 3.5a5.5 5.5 0 1 0 3.47 9.77l3.63 3.63a.75.75 0 1 0 1.06-1.06l-3.63-3.63A5.5 5.5 0 0 0 9 3.5ZM5 9a4 4 0 1 1 8 0 4 4 0 0 1-8 0Z" clip-rule="evenodd" />
          </svg>
          <input id="search" type="search" placeholder="Search description or category…" aria-label="Search transactions"
            class="w-full rounded-lg border border-slate-300 py-2 pl-9 pr-3 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div id="filterGroup" class="inline-flex rounded-lg bg-slate-100 p-1" role="group" aria-label="Filter by type">
          <button type="button" data-filter="all"     class="filter-btn rounded-md px-3 py-1.5 text-sm font-medium">All</button>
          <button type="button" data-filter="income"  class="filter-btn rounded-md px-3 py-1.5 text-sm font-medium">Income</button>
          <button type="button" data-filter="expense" class="filter-btn rounded-md px-3 py-1.5 text-sm font-medium">Expenses</button>
        </div>
      </div>

      <ul id="txList" class="divide-y divide-slate-100"></ul>
      <p id="emptyState" class="py-6 text-center text-sm text-slate-500 hidden"></p>
    </section>

  </main>

  <!-- Delete Confirmation Dialog -->
  <dialog id="confirmDialog" class="w-[calc(100%-2rem)] max-w-sm rounded-xl p-0 shadow-xl">
    <form method="dialog" class="p-5">
      <h3 class="text-lg font-semibold text-slate-800">Delete transaction?</h3>
      <p id="confirmText" class="mt-2 text-sm text-slate-600"></p>
      <div class="mt-5 flex justify-end gap-2">
        <button value="cancel" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50">Cancel</button>
        <button value="confirm" class="rounded-lg bg-rose-600 px-4 py-2 text-sm font-medium text-white hover:bg-rose-700">Delete</button>
      </div>
    </form>
  </dialog>

  <script>
    // ---- State ----
    let transactions = [
      { id: 1, description: 'Monthly salary',      amount: 2400.00, type: 'income',  category: 'Salary' },
      { id: 2, description: 'Supermarket shop',    amount: 64.35,   type: 'expense', category: 'Food' },
      { id: 3, description: 'Electricity bill',    amount: 89.00,   type: 'expense', category: 'Utilities' },
      { id: 4, description: 'Cinema tickets',      amount: 22.50,   type: 'expense', category: 'Entertainment' },
      { id: 5, description: 'Train season top-up', amount: 45.00,   type: 'expense', category: 'Transport' },
    ];

    let searchQuery = '';
    let activeFilter = 'all';   // 'all' | 'income' | 'expense'
    let editingId = null;       // id of transaction being edited, or null
    let pendingDeleteId = null;

    // One source of truth per category: badge classes + chart colour
    const CATEGORIES = {
      Food:          { badge: 'bg-amber-100 text-amber-800',     color: '#f59e0b' },
      Utilities:     { badge: 'bg-sky-100 text-sky-800',         color: '#0ea5e9' },
      Salary:        { badge: 'bg-emerald-100 text-emerald-800', color: '#10b981' },
      Entertainment: { badge: 'bg-fuchsia-100 text-fuchsia-800', color: '#d946ef' },
      Transport:     { badge: 'bg-indigo-100 text-indigo-800',   color: '#6366f1' },
    };

    // ---- Helpers ----
    const currency = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });

    function escapeHTML(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function findTx(id) {
      return transactions.find(t => t.id === id);
    }

    function getTotals() {
      let income = 0, expenses = 0;
      for (const t of transactions) {
        if (t.type === 'income') income += t.amount;
        else expenses += t.amount;
      }
      return { income, expenses, net: income - expenses };
    }

    function getExpensesByCategory() {
      const totals = {};
      for (const t of transactions) {
        if (t.type !== 'expense') continue;
        totals[t.category] = (totals[t.category] || 0) + t.amount;
      }
      return totals;
    }

    // Search and type filter combine: an item must pass both
    function getVisibleTransactions() {
      const q = searchQuery.trim().toLowerCase();
      return transactions.filter(t => {
        const matchesType = activeFilter === 'all' || t.type === activeFilter;
        const matchesSearch = !q ||
          t.description.toLowerCase().includes(q) ||
          t.category.toLowerCase().includes(q);
        return matchesType && matchesSearch;
      });
    }

    // ---- Rendering: header + summary ----
    const balanceEl = document.getElementById('balance');

    function renderBalance({ net }) {
      balanceEl.textContent = currency.format(net);
      balanceEl.classList.toggle('text-rose-200', net < 0);
    }

    const netCard = document.getElementById('netCard');
    const netLabel = document.getElementById('netLabel');
    const netValue = document.getElementById('netBalance');

    const NET_STYLES = {
      positive: { card: ['bg-emerald-50', 'ring-1', 'ring-emerald-200'], label: 'text-emerald-700', value: 'text-emerald-700' },
      negative: { card: ['bg-rose-50', 'ring-1', 'ring-rose-200'],       label: 'text-rose-700',    value: 'text-rose-700' },
      zero:     { card: ['bg-white'],                                    label: 'text-slate-500',   value: 'text-slate-800' },
    };
    const ALL_NET_CLASSES = {
      card:  [...new Set(Object.values(NET_STYLES).flatMap(s => s.card))],
      label: Object.values(NET_STYLES).map(s => s.label),
      value: Object.values(NET_STYLES).map(s => s.value),
    };

    function renderSummary({ income, expenses, net }) {
      document.getElementById('totalIncome').textContent = currency.format(income);
      document.getElementById('totalExpenses').textContent = currency.format(expenses);
      netValue.textContent = currency.format(net);

      const state = net > 0 ? 'positive' : net < 0 ? 'negative' : 'zero';
      const s = NET_STYLES[state];
      netCard.classList.remove(...ALL_NET_CLASSES.card);
      netCard.classList.add(...s.card);
      netLabel.classList.remove(...ALL_NET_CLASSES.label);
      netLabel.classList.add(s.label);
      netValue.classList.remove(...ALL_NET_CLASSES.value);
      netValue.classList.add(s.value);
    }

    // ---- Rendering: chart ----
    const chartEmptyEl = document.getElementById('chartEmpty');
    const expenseChart = new Chart(document.getElementById('expenseChart'), {
      type: 'pie',
      data: { labels: [], datasets: [{ data: [], backgroundColor: [], borderColor: '#ffffff', borderWidth: 2 }] },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'bottom', labels: { usePointStyle: true, padding: 16 } },
          tooltip: {
            callbacks: {
              label(ctx) {
                const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                const pct = total ? ((ctx.parsed / total) * 100).toFixed(1) : 0;
                return ` ${ctx.label}: ${currency.format(ctx.parsed)} (${pct}%)`;
              },
            },
          },
        },
      },
    });

    function renderChart() {
      const byCategory = getExpensesByCategory();
      const labels = Object.keys(CATEGORIES).filter(c => byCategory[c] > 0);
      const ds = expenseChart.data.datasets[0];

      expenseChart.data.labels = labels;
      ds.data = labels.map(c => Math.round(byCategory[c] * 100) / 100);
      ds.backgroundColor = labels.map(c => CATEGORIES[c].color);
      expenseChart.update();

      const empty = labels.length === 0;
      chartEmptyEl.classList.toggle('hidden', !empty);
      chartEmptyEl.classList.toggle('flex', empty);
    }

    // ---- Rendering: filters + list ----
    const listEl = document.getElementById('txList');
    const emptyEl = document.getElementById('emptyState');
    const filterBtns = document.querySelectorAll('.filter-btn');

    function renderFilters() {
      filterBtns.forEach(btn => {
        const active = btn.dataset.filter === activeFilter;
        btn.setAttribute('aria-pressed', active);
        btn.classList.toggle('bg-white', active);
        btn.classList.toggle('shadow-sm', active);
        btn.classList.toggle('text-indigo-700', active);
        btn.classList.toggle('text-slate-600', !active);
        btn.classList.toggle('hover:text-slate-900', !active);
      });
    }

    function renderList() {
      const visible = getVisibleTransactions();

      if (visible.length === 0) {
        emptyEl.textContent = transactions.length === 0
          ? 'No transactions yet.'
          : 'No transactions match your search or filter.';
        emptyEl.classList.remove('hidden');
      } else {
        emptyEl.classList.add('hidden');
      }

      // Newest first
      listEl.innerHTML = [...visible].reverse().map(t => {
        const isIncome = t.type === 'income';
        const isEditing = t.id === editingId;
        const badge = CATEGORIES[t.category]?.badge || 'bg-slate-100 text-slate-700';
        return `
          <li class="flex flex-wrap items-center gap-3 py-3 ${isEditing ? '-mx-2 rounded-lg bg-amber-50 px-2' : ''}">
            <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full font-bold
                         ${isIncome ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}"
                  title="${isIncome ? 'Income' : 'Expense'}">
              ${isIncome ? '+' : '−'}
            </span>
            <div class="min-w-0 flex-1">
              <p class="font-medium truncate">${escapeHTML(t.description)}</p>
              <span class="mt-1 inline-block rounded-full px-2 py-0.5 text-xs font-medium ${badge}">
                ${t.category}
              </span>
            </div>
            <p class="shrink-0 font-semibold tabular-nums ${isIncome ? 'text-emerald-600' : 'text-rose-600'}">
              ${isIncome ? '+' : '−'}${currency.format(t.amount)}
            </p>
            <div class="flex shrink-0 gap-1 w-full justify-end sm:w-auto">
              <button type="button" data-action="edit" data-id="${t.id}"
                class="rounded-md px-2.5 py-1 text-sm font-medium text-indigo-600 hover:bg-indigo-50 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                Edit
              </button>
              <button type="button" data-action="delete" data-id="${t.id}"
                class="rounded-md px-2.5 py-1 text-sm font-medium text-rose-600 hover:bg-rose-50 focus:outline-none focus:ring-2 focus:ring-rose-500">
                Delete
              </button>
            </div>
          </li>`;
      }).join('');
    }

    // Single entry point: every UI piece refreshes from the same data
    function render() {
      const totals = getTotals();
      renderBalance(totals);
      renderSummary(totals);
      renderChart();
      renderFilters();
      renderList();
    }

    // ---- Search + filter events ----
    document.getElementById('search').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderList();
    });

    filterBtns.forEach(btn => btn.addEventListener('click', () => {
      activeFilter = btn.dataset.filter;
      renderFilters();
      renderList();
    }));

    // ---- Form: add + edit ----
    const form = document.getElementById('txForm');
    const formSection = document.getElementById('formSection');
    const formTitle = document.getElementById('formTitle');
    const editBadge = document.getElementById('editBadge');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    const errorEl = document.getElementById('formError');

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.remove('hidden');
    }

    function resetForm() {
      form.description.value = '';
      form.amount.value = '';
      errorEl.classList.add('hidden');
    }

    function setEditMode(id) {
      editingId = id;
      const editing = id !== null;
      formTitle.textContent = editing ? 'Edit Transaction' : 'Add Transaction';
      submitBtn.textContent = editing ? 'Update Transaction' : 'Add Transaction';
      editBadge.classList.toggle('hidden', !editing);
      cancelEditBtn.classList.toggle('hidden', !editing);
      formSection.classList.toggle('ring-2', editing);
      formSection.classList.toggle('ring-amber-300', editing);
    }

    function startEdit(id) {
      const t = findTx(id);
      if (!t) return;
      form.description.value = t.description;
      form.amount.value = t.amount.toFixed(2);
      form.type.value = t.type;
      form.category.value = t.category;
      errorEl.classList.add('hidden');
      setEditMode(id);
      renderList();
      formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
      form.description.focus({ preventScroll: true });
    }

    function cancelEdit() {
      setEditMode(null);
      resetForm();
      renderList();
    }

    cancelEditBtn.addEventListener('click', cancelEdit);

    form.addEventListener('submit', e => {
      e.preventDefault();
      const description = form.description.value.trim();
      const amount = parseFloat(form.amount.value);

      if (!description) return showError('Please enter a description.');
      if (!Number.isFinite(amount) || amount <= 0) return showError('Please enter an amount greater than 0.');

      const data = {
        description,
        amount: Math.round(amount * 100) / 100,
        type: form.type.value,
        category: form.category.value,
      };

      if (editingId !== null) {
        transactions = transactions.map(t => t.id === editingId ? { ...t, ...data } : t);
        setEditMode(null);
      } else {
        transactions.push({ id: Date.now(), ...data });
      }

      resetForm();
      form.description.focus();
      render();
    });

    // ---- Delete with confirmation ----
    const confirmDialog = document.getElementById('confirmDialog');
    const confirmText = document.getElementById('confirmText');

    function requestDelete(id) {
      const t = findTx(id);
      if (!t) return;
      pendingDeleteId = id;
      confirmText.innerHTML =
        `“${escapeHTML(t.description)}” (${currency.format(t.amount)}) will be permanently removed.`;
      confirmDialog.showModal();
    }

    confirmDialog.addEventListener('close', () => {
      if (confirmDialog.returnValue === 'confirm' && pendingDeleteId !== null) {
        transactions = transactions.filter(t => t.id !== pendingDeleteId);
        if (editingId === pendingDeleteId) {   // deleted the item being edited
          setEditMode(null);
          resetForm();
        }
        render();
      }
      pendingDeleteId = null;
      confirmDialog.returnValue = '';
    });

    // Clicking the backdrop cancels
    confirmDialog.addEventListener('click', e => {
      if (e.target === confirmDialog) confirmDialog.close('cancel');
    });

    // ---- Row actions (event delegation) ----
    listEl.addEventListener('click', e => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const id = Number(btn.dataset.id);
      if (btn.dataset.action === 'edit') startEdit(id);
      if (btn.dataset.action === 'delete') requestDelete(id);
    });

    render();
  </script>
</body>
</html>
